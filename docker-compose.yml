# MySQL Healthcheck SaaS — Docker Compose 部署
#
# 快速启动：
#   docker compose up -d
#
# 配合 nginx 反向代理（推荐）：本服务只绑 127.0.0.1:3000，nginx 走 80/443，
# 详见 deploy/DEPLOY.md
#
# 数据持久化：所有上传 / 报告 / 历史在宿主机 /var/lib/mysql-healthcheck/
# 升级：git pull && docker compose build && docker compose up -d
#
# 环境变量覆盖：编辑同目录 .env，或在 shell 里 export 后再 up

services:
  saas:
    build:
      context: .
      dockerfile: Dockerfile
    image: mysql-healthcheck-saas:latest
    container_name: mysql-hc-saas
    restart: unless-stopped

    # 仅绑本地回环 — 由 host 上的 nginx 转发；
    # 想直接对外暴露，把 HOST_BIND 设为 0.0.0.0（不推荐 — 无 HTTPS / 无鉴权）
    # 想换宿主机端口，改 HOST_PORT（容器内端口 PORT 一般保持 3000 即可）
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      STORAGE_ROOT: /data
      MAX_FILES: ${MAX_FILES:-16}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-50}
      # 鉴权（可选）：在同目录 .env 写 API_KEY=xxx 或直接 export
      # 客户端调用需带 Authorization: Bearer xxx
      API_KEY: ${API_KEY:-}
      MYSQL_HC_LLM_CONFIG: /run/secrets/mysql-healthcheck-llm.json
      MYSQL_HC_LLM_API_KEY: ${MYSQL_HC_LLM_API_KEY:-}

    volumes:
      # 持久化数据；宿主机目录不存在会自动创建（但要确保父目录权限）
      - ${STORAGE_HOST_DIR:-/var/lib/mysql-healthcheck}:/data
      # 默认挂载 enabled=false 的关闭配置；启用时在 .env 让 MYSQL_HC_LLM_CONFIG_HOST
      # 指向复制并编辑后的 llm.json。
      - ${MYSQL_HC_LLM_CONFIG_HOST:-./scripts/config/llm.disabled.json}:/run/secrets/mysql-healthcheck-llm.json:ro

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # 资源限制（按服务器规模调整）
    # 默认配置：4 GB 内存上限够 8 节点 × 50MB txt × 报告生成并发 2
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

    # 日志轮转，避免 docker logs 撑爆磁盘
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

# 命名 volume 方式（可选）— 取代上面的 bind mount。
# 用 docker volume 管理，docker volume inspect mysql_hc_data 看路径。
# volumes:
#   mysql_hc_data:
